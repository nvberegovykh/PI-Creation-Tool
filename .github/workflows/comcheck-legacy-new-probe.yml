name: COMcheck Legacy New Probe
on:
  push:
    paths:
      - '.github/workflows/comcheck-legacy-new-probe.yml'
      - 'tools/comcheck/legacy_new_probe.py'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python tools/comcheck/legacy_new_probe.py
