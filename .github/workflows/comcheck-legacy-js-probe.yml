name: COMcheck Legacy JS Probe
on:
  push:
    paths:
      - '.github/workflows/comcheck-legacy-js-probe.yml'
      - 'tools/comcheck/legacy_js_probe.py'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python tools/comcheck/legacy_js_probe.py
