name: COMcheck Probe
on:
  push:
    paths:
      - '.github/workflows/comcheck-probe.yml'
      - 'tools/comcheck/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python tools/comcheck/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comcheck-probe
          path: tools/comcheck/out
          if-no-files-found: warn
