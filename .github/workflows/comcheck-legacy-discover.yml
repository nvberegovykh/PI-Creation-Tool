name: COMcheck Legacy Discover
on:
  push:
    paths:
      - '.github/workflows/comcheck-legacy-discover.yml'
      - 'tools/comcheck/legacy_discover.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: pip install playwright
      - shell: pwsh
        run: playwright install chromium
      - shell: pwsh
        run: python tools/comcheck/legacy_discover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comcheck-legacy-discover
          path: tools/comcheck/legacy_discover
          if-no-files-found: warn
