name: COMcheck Legacy DWR Run
on:
  push:
    paths:
      - '.github/workflows/comcheck-legacy-dwr-run.yml'
      - 'tools/comcheck/legacy_dwr_run.py'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python tools/comcheck/legacy_dwr_run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comcheck-legacy-dwr-out
          path: tools/comcheck/legacy_dwr_out
          if-no-files-found: warn
